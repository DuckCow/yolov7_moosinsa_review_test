name: portfolio-demo-run

on:
  push:
    branches:
      - portfolio-demo-run
    paths:
      - 'portfolio_demo/**'
      - '.github/workflows/portfolio-demo.yml'

permissions:
  contents: write

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-demo-run

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install opencv-python-headless pillow requests numpy

      - name: Run actual prototype on same-product image pair
        run: |
          python portfolio_demo/run_demo.py

      - name: Encode results for retrieval
        run: |
          base64 -w0 demo-output/product_result.png > demo-output/product_result.png.b64
          base64 -w0 demo-output/worn_result.png > demo-output/worn_result.png.b64
          base64 -w0 demo-output/product_input.jpg > demo-output/product_input.jpg.b64
          base64 -w0 demo-output/worn_input.jpg > demo-output/worn_input.jpg.b64

      - name: Commit generated demo evidence
        run: |
          git config user.name "portfolio-demo-bot"
          git config user.email "portfolio-demo-bot@users.noreply.github.com"
          git add demo-output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add actual portfolio demo results [skip ci]"
          git push origin HEAD:portfolio-demo-run
